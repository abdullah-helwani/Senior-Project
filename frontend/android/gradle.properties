org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Direct access to dl.google.com is blocked on this network (returns 404), so
# Gradle must download dependencies through Psiphon's local HTTP proxy.
# (Don't use useSystemProxies here: Windows also advertises a SOCKS proxy that
# Java prefers but that intermittently refuses connections — pin HTTP instead.)
# NOTE: if Psiphon changes its local proxy port, update the port below (or set a
# fixed local HTTP proxy port in Psiphon's settings to make this permanent).
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=61880
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=61880
